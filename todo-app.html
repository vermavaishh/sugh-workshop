<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tasks — To-Do with Alarm</title>
<style>
  :root {
    --bg: #0f1220;
    --card: #1a1f35;
    --card-2: #222845;
    --text: #eef0ff;
    --muted: #9aa1c9;
    --accent: #7c6cff;
    --accent-2: #5a8bff;
    --danger: #ff5d73;
    --success: #3ddc97;
    --ring: #ffb545;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, #262c52 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .app {
    max-width: 560px;
    margin: 0 auto;
  }
  header { text-align: center; margin-bottom: 22px; }
  header h1 { font-size: 1.7rem; letter-spacing: .3px; }
  header p { color: var(--muted); font-size: .9rem; margin-top: 4px; }
  .clock {
    text-align: center;
    font-variant-numeric: tabular-nums;
    color: var(--accent-2);
    font-size: 1rem;
    margin-bottom: 18px;
  }
  form.add {
    background: var(--card);
    border: 1px solid #2b3158;
    border-radius: var(--radius);
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-bottom: 22px;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label { font-size: .78rem; color: var(--muted); display: block; margin-bottom: 4px; }
  input[type="text"], input[type="date"], input[type="time"], select {
    width: 100%;
    background: var(--card-2);
    border: 1px solid #343b66;
    border-radius: 10px;
    color: var(--text);
    padding: 11px 12px;
    font-size: .95rem;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input[type="date"], input[type="time"], select { color-scheme: dark; }
  select { cursor: pointer; }
  button.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: transform .1s ease, opacity .15s;
  }
  button.primary:hover { opacity: .92; }
  button.primary:active { transform: scale(.98); }
  .notif-banner {
    background: #3a2f14;
    border: 1px solid #6b5620;
    color: #ffd98a;
    font-size: .85rem;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 16px;
    display: none;
    cursor: pointer;
  }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; font-size: .95rem; }
  .task {
    background: var(--card);
    border: 1px solid #2b3158;
    border-radius: var(--radius);
    padding: 13px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .task.done { opacity: .55; }
  .task.done .title { text-decoration: line-through; }
  .task.overdue { border-color: var(--danger); }
  .task.ringing {
    border-color: var(--ring);
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 181, 69, .55); }
    50% { box-shadow: 0 0 0 8px rgba(255, 181, 69, 0); }
  }
  .task .check {
    width: 22px; height: 22px; flex: none;
    accent-color: var(--success);
    cursor: pointer;
  }
  .task .info { flex: 1; min-width: 0; }
  .task .title { font-size: 1rem; font-weight: 600; word-wrap: break-word; }
  .task .when { font-size: .8rem; color: var(--muted); margin-top: 2px; }
  .badge {
    display: inline-block;
    background: #263257;
    color: #9db6ff;
    border-radius: 6px;
    font-size: .68rem;
    font-weight: 600;
    padding: 2px 7px;
    margin-left: 6px;
    vertical-align: 1px;
  }
  .task .when.soon { color: var(--ring); }
  .task .when.past { color: var(--danger); }
  .task .del {
    background: none; border: none; color: var(--muted);
    font-size: 1.15rem; cursor: pointer; padding: 6px;
    border-radius: 8px;
  }
  .task .del:hover { color: var(--danger); background: #2a1b26; }
  /* Alarm overlay */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(10, 12, 25, .82);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center; justify-content: center;
    z-index: 50;
  }
  .overlay.show { display: flex; }
  .alarm-box {
    background: var(--card);
    border: 2px solid var(--ring);
    border-radius: 20px;
    padding: 34px 30px;
    text-align: center;
    max-width: 420px;
    width: calc(100% - 40px);
    animation: pulse 1s infinite;
  }
  .alarm-box .bell { font-size: 3rem; animation: shake .6s infinite; display: inline-block; }
  @keyframes shake {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-18deg); }
    75% { transform: rotate(18deg); }
  }
  .alarm-box h2 { margin: 12px 0 4px; font-size: 1.15rem; color: var(--ring); }
  .alarm-box .alarm-task { font-size: 1.5rem; font-weight: 700; margin-bottom: 22px; word-wrap: break-word; }
  .alarm-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .alarm-actions button {
    border: none; border-radius: 10px; padding: 12px 20px;
    font-size: .95rem; font-weight: 600; cursor: pointer;
  }
  .btn-done { background: var(--success); color: #0b2417; }
  .btn-snooze { background: var(--card-2); color: var(--text); border: 1px solid #343b66 !important; }
  footer { text-align: center; color: var(--muted); font-size: .75rem; margin-top: 30px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>⏰ My Tasks</h1>
    <p>Add a task with a time — I'll ring an alarm when it's due.</p>
  </header>

  <div class="clock" id="clock"></div>

  <div class="notif-banner" id="notifBanner">
    🔔 Click here to enable browser notifications so alarms can alert you even when you're on another tab.
  </div>

  <form class="add" id="addForm">
    <div>
      <label for="taskInput">Task</label>
      <input type="text" id="taskInput" placeholder="e.g. Call the client" required maxlength="120" autocomplete="off">
    </div>
    <div class="row2">
      <div>
        <label for="dateInput">Date</label>
        <input type="date" id="dateInput" required>
      </div>
      <div>
        <label for="timeInput">Time</label>
        <input type="time" id="timeInput" required>
      </div>
    </div>
    <div>
      <label for="repeatInput">Repeat</label>
      <select id="repeatInput">
        <option value="none">Once only</option>
        <option value="daily">Every day</option>
        <option value="weekly">Every week</option>
      </select>
    </div>
    <button class="primary" type="submit">＋ Add Task</button>
  </form>

  <div class="list" id="list"></div>

  <footer>Tasks are saved in this browser. Keep this tab open for alarms to ring.</footer>
</div>

<!-- Alarm overlay -->
<div class="overlay" id="overlay">
  <div class="alarm-box">
    <span class="bell">🔔</span>
    <h2>Time's up!</h2>
    <div class="alarm-task" id="alarmTaskName"></div>
    <div class="alarm-actions">
      <button class="btn-done" id="alarmDoneBtn">✓ Done</button>
      <button class="btn-snooze" id="alarmSnoozeBtn">Snooze 5 min</button>
    </div>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = "todo-alarm-tasks";

  let tasks = load();
  let ringingTaskId = null;
  let audioCtx = null;
  let alarmTimer = null;

  const listEl = document.getElementById("list");
  const form = document.getElementById("addForm");
  const taskInput = document.getElementById("taskInput");
  const dateInput = document.getElementById("dateInput");
  const timeInput = document.getElementById("timeInput");
  const overlay = document.getElementById("overlay");
  const alarmTaskName = document.getElementById("alarmTaskName");
  const notifBanner = document.getElementById("notifBanner");
  const clockEl = document.getElementById("clock");

  // ---------- storage ----------
  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  // ---------- helpers ----------
  function pad(n) { return String(n).padStart(2, "0"); }

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function fmtWhen(t) {
    const d = new Date(t.due);
    const now = new Date();
    const time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    if (t.repeat === "daily") return "Every day at " + time;
    if (t.repeat === "weekly") {
      return "Every " + d.toLocaleDateString([], { weekday: "long" }) + " at " + time;
    }
    const sameDay = d.toDateString() === now.toDateString();
    const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
    const isTomorrow = d.toDateString() === tomorrow.toDateString();
    if (sameDay) return "Today at " + time;
    if (isTomorrow) return "Tomorrow at " + time;
    return d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" }) + " at " + time;
  }

  // Move a repeating task's due time to the next future occurrence,
  // anchored to its original scheduled time (so snoozing doesn't drift it).
  function advanceRepeat(t) {
    const step = t.repeat === "weekly" ? 7 : 1;
    const d = new Date(t.originalDue || t.due);
    delete t.originalDue;
    while (d.getTime() <= Date.now()) d.setDate(d.getDate() + step);
    t.due = d.getTime();
    t.alarmFired = false;
    t.done = false;
  }

  // ---------- render ----------
  function render() {
    listEl.innerHTML = "";
    if (tasks.length === 0) {
      listEl.innerHTML = '<div class="empty">No tasks yet. Add your first one above 👆</div>';
      return;
    }
    const sorted = [...tasks].sort((a, b) => (a.done - b.done) || (a.due - b.due));
    const now = Date.now();
    for (const t of sorted) {
      const item = document.createElement("div");
      item.className = "task" + (t.done ? " done" : "") +
        (!t.done && t.due < now ? " overdue" : "") +
        (t.id === ringingTaskId ? " ringing" : "");

      const check = document.createElement("input");
      check.type = "checkbox";
      check.className = "check";
      check.checked = t.done;
      check.title = "Mark done";
      check.addEventListener("change", () => toggleDone(t.id));

      const info = document.createElement("div");
      info.className = "info";
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = t.text;
      if (t.repeat && t.repeat !== "none") {
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "🔁 " + (t.repeat === "daily" ? "Daily" : "Weekly");
        title.appendChild(badge);
      }
      const when = document.createElement("div");
      const mins = (t.due - now) / 60000;
      when.className = "when" + (!t.done && mins < 0 ? " past" : (!t.done && mins <= 30 ? " soon" : ""));
      when.textContent = "⏰ " + fmtWhen(t) + (!t.done && mins < 0 ? " · missed" : "");
      info.appendChild(title);
      info.appendChild(when);

      const del = document.createElement("button");
      del.className = "del";
      del.title = "Delete task";
      del.textContent = "🗑";
      del.addEventListener("click", () => removeTask(t.id));

      item.appendChild(check);
      item.appendChild(info);
      item.appendChild(del);
      listEl.appendChild(item);
    }
  }

  // ---------- task ops ----------
  function addTask(text, due, repeat) {
    tasks.push({ id: Date.now() + "-" + Math.random().toString(36).slice(2, 7), text, due, repeat, done: false, alarmFired: false });
    save();
    render();
  }
  function toggleDone(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    if (t.repeat && t.repeat !== "none") {
      // "done for today" — reschedule for the next occurrence
      if (ringingTaskId === id) stopAlarm();
      advanceRepeat(t);
    } else {
      t.done = !t.done;
      if (t.done && ringingTaskId === id) stopAlarm();
    }
    save();
    render();
  }
  function removeTask(id) {
    if (ringingTaskId === id) stopAlarm();
    tasks = tasks.filter(x => x.id !== id);
    save();
    render();
  }

  // ---------- alarm sound (Web Audio, no files needed) ----------
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }
  function beepPattern() {
    ensureAudio();
    const now = audioCtx.currentTime;
    // classic alarm: three quick beeps
    for (let i = 0; i < 3; i++) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = i % 2 === 0 ? 880 : 988;
      const t0 = now + i * 0.25;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.22);
    }
  }
  function startAlarm(task) {
    ringingTaskId = task.id;
    alarmTaskName.textContent = task.text;
    overlay.classList.add("show");
    document.title = "🔔 " + task.text;
    beepPattern();
    alarmTimer = setInterval(beepPattern, 1200);
    if ("Notification" in window && Notification.permission === "granted") {
      try {
        new Notification("⏰ Time's up!", { body: task.text, tag: task.id, requireInteraction: true });
      } catch {}
    }
    render();
  }
  function stopAlarm() {
    if (alarmTimer) { clearInterval(alarmTimer); alarmTimer = null; }
    ringingTaskId = null;
    overlay.classList.remove("show");
    document.title = "My Tasks — To-Do with Alarm";
    render();
  }

  document.getElementById("alarmDoneBtn").addEventListener("click", () => {
    const t = tasks.find(x => x.id === ringingTaskId);
    if (t) {
      if (t.repeat && t.repeat !== "none") advanceRepeat(t);
      else t.done = true;
      save();
    }
    stopAlarm();
  });
  document.getElementById("alarmSnoozeBtn").addEventListener("click", () => {
    const t = tasks.find(x => x.id === ringingTaskId);
    if (t) {
      if (t.repeat && t.repeat !== "none" && !t.originalDue) t.originalDue = t.due;
      t.due = Date.now() + 5 * 60 * 1000;
      t.alarmFired = false;
      save();
    }
    stopAlarm();
  });

  // ---------- ticking ----------
  function tick() {
    const now = new Date();
    clockEl.textContent = now.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" }) +
      " · " + now.toLocaleTimeString();
    // repeating tasks missed by more than 12h (e.g. browser was closed):
    // skip silently to the next occurrence instead of ringing a stale alarm
    let advanced = false;
    for (const t of tasks) {
      if (t.repeat && t.repeat !== "none" && !t.done && t.due <= now.getTime() - 12 * 60 * 60 * 1000) {
        advanceRepeat(t);
        advanced = true;
      }
    }
    if (advanced) { save(); render(); }
    if (ringingTaskId) return; // one alarm at a time
    const due = tasks.find(t => !t.done && !t.alarmFired && t.due <= now.getTime() && t.due > now.getTime() - 12 * 60 * 60 * 1000);
    if (due) {
      due.alarmFired = true;
      save();
      startAlarm(due);
    }
  }
  setInterval(tick, 1000);
  tick();

  // refresh relative labels every 30s
  setInterval(render, 30000);

  // ---------- form ----------
  dateInput.value = todayStr();
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = taskInput.value.trim();
    if (!text) return;
    const due = new Date(dateInput.value + "T" + timeInput.value).getTime();
    if (isNaN(due)) return;
    ensureAudio(); // unlock audio on user gesture so the alarm can play later
    addTask(text, due, document.getElementById("repeatInput").value);
    form.reset();
    dateInput.value = todayStr();
    taskInput.focus();
  });

  // ---------- notifications ----------
  if ("Notification" in window && Notification.permission === "default") {
    notifBanner.style.display = "block";
    notifBanner.addEventListener("click", async () => {
      const perm = await Notification.requestPermission();
      if (perm !== "default") notifBanner.style.display = "none";
    });
  }

  render();
})();
</script>
</body>
</html>
